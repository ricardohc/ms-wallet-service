openapi: 3.0.3
info:
  title: Wallet Service API (Yanki)
  description: Monedero móvil Yanki. No requiere ser cliente del banco. Las operaciones monetarias delegan a Transaction Service.
  version: 1.0.0

tags:
  - name: Wallet
    description: Operaciones de gestión del monedero Yanki

security:
  - BearerAuth: []
paths:
  /api/v1/wallets:
    post:
      tags:
        - Wallet
      summary: Registrar monedero Yanki
      description: Idempotente mediante X-Transaction-ID. La autenticación de no-clientes se realiza mediante un token temporal emitido tras validar OTP al teléfono registrado. Devuelve 409 si el documento o el teléfono ya están registrados.
      operationId: createWallet
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletCreateRequest' } } }
      responses:
        '201':
          description: Monedero creado
          content: { application/json: { schema: { $ref: '#/components/schemas/WalletResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/wallets/{walletId}:
    get:
      tags:
        - Wallet
      summary: Obtener monedero
      operationId: findWalletById
      parameters:
        - $ref: '#/components/parameters/WalletIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
      responses:
        '200':
          description: Detalle del monedero
          content: { application/json: { schema: { $ref: '#/components/schemas/WalletResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags:
        - Wallet
      summary: Actualizar monedero (parcial)
      operationId: updateWallet
      parameters:
        - $ref: '#/components/parameters/WalletIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletUpdateRequest' } } }
      responses:
        '200':
          description: Monedero actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/WalletResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags:
        - Wallet
      summary: Baja lógica del monedero
      operationId: deactivateWallet
      parameters:
        - $ref: '#/components/parameters/WalletIdPath'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      responses:
        '204': { description: Monedero desactivado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/wallets/transfers:
    post:
      tags:
        - Wallet
      summary: Transferencia Yanki por número de celular
      description: Idempotente mediante X-Transaction-ID. Delegado a Transaction Service para orquestación.
      operationId: createWalletTransfer
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
        - $ref: '#/components/parameters/TransactionIdHeader'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletTransferRequest' } } }
      responses:
        '202':
          description: Transferencia aceptada
          content: { application/json: { schema: { $ref: '#/components/schemas/OperationAcceptedResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/wallets/balance:
    get:
      tags:
        - Wallet
      summary: Consultar saldo del monedero
      operationId: findWalletBalance
      parameters:
        - name: phoneNumber
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{9,15}$' }
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ChannelIdHeader'
      responses:
        '200':
          description: Saldo del monedero
          content: { application/json: { schema: { $ref: '#/components/schemas/BalanceResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    CorrelationIdHeader: { name: X-Correlation-ID, in: header, required: true, schema: { type: string } }
    ChannelIdHeader: { name: X-Channel-ID, in: header, required: true, schema: { type: string } }
    TransactionIdHeader: { name: X-Transaction-ID, in: header, required: true, schema: { type: string, format: uuid } }
    WalletIdPath: { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    DocumentType: { type: string, enum: [DNI, CEX, PASSPORT] }
    WalletStatus: { type: string, enum: [ACTIVE, INACTIVE] }
    WalletCreateRequest:
      type: object
      required: [documentType, documentNumber, phoneNumber, email]
      properties:
        documentType: { $ref: '#/components/schemas/DocumentType' }
        documentNumber: { type: string, minLength: 5, maxLength: 20 }
        phoneNumber: { type: string, pattern: '^[0-9]{9,15}$' }
        imei: { type: string, description: "Opcional, no confiable como credencial" }
        email: { type: string, format: email }
    WalletUpdateRequest:
      type: object
      properties:
        linkedDebitCardId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WalletStatus' }
    WalletTransferRequest:
      type: object
      required: [sourcePhoneNumber, targetPhoneNumber, amount, currency]
      properties:
        sourcePhoneNumber: { type: string, pattern: '^[0-9]{9,15}$' }
        targetPhoneNumber: { type: string, pattern: '^[0-9]{9,15}$' }
        amount: { type: string, pattern: '^(?!0+(\.0+)?$)[0-9]+(\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    WalletResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        phoneNumber: { type: string }
        email: { type: string }
        status: { $ref: '#/components/schemas/WalletStatus' }
        linkedDebitCardId: { type: string, format: uuid }
        balance: { type: string }
        currency: { type: string }
    BalanceResponse:
      type: object
      properties:
        balance: { type: string }
        currency: { type: string }
    OperationAcceptedResponse:
      type: object
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string }
    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        correlationId: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: No autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: No autorizado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: No encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Conflicto (ej. monedero duplicado por documento o teléfono)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: Entidad no procesable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InternalServerError:
      description: Error interno
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }