server:
  port: 8087

spring:
  application:
    name: ms-wallet-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/banking_yanki}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

external:
  services:
    account-base-url: ${ACCOUNT_SERVICE_URL:http://ms-account-service}
    card-base-url: ${CARD_SERVICE_URL:http://ms-card-service}
    transaction-base-url: ${TRANSACTION_SERVICE_URL:http://ms-transaction-service}

logging:
  level:
    com.banking.wallet: DEBUG
